<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - Folio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Merriweather:wght@300;400;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#c3c0ff",
                        "on-background": "#121c2a",
                        "secondary": "#712ae2",
                        "on-secondary-fixed": "#25005a",
                        "surface-tint": "#4d44e3",
                        "outline": "#777587",
                        "primary-fixed": "#e2dfff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#a44100",
                        "tertiary-fixed-dim": "#ffb695",
                        "surface-container": "#e6eeff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#464555",
                        "on-tertiary-container": "#ffd2be",
                        "tertiary-fixed": "#ffdbcc",
                        "on-primary-fixed": "#0f0069",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-dim": "#d0dbed",
                        "outline-variant": "#c7c4d8",
                        "on-primary-fixed-variant": "#3323cc",
                        "secondary-container": "#8a4cfc",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "background": "#f8f9ff",
                        "surface-variant": "#d9e3f6",
                        "on-primary-container": "#dad7ff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "on-tertiary-fixed": "#351000",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "surface": "#f8f9ff",
                        "on-secondary-container": "#fffbff",
                        "inverse-surface": "#27313f",
                        "surface-bright": "#f8f9ff",
                        "secondary-fixed": "#eaddff",
                        "on-surface": "#121c2a",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#dee9fc",
                        "primary-container": "#4f46e5",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-highest": "#d9e3f6",
                        "primary": "#3525cd",
                        "secondary-fixed-dim": "#d2bbff",
                        "tertiary": "#7e3000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "container-max": "1280px",
                        "stack-md": "24px",
                        "stack-lg": "64px",
                        "article-width": "720px",
                        "gutter": "24px",
                        "margin-edge": "32px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Playfair Display"],
                        "article-body": ["Merriweather"],
                        "ui-button": ["Public Sans"],
                        "headline-md": ["Playfair Display"],
                        "article-body-mobile": ["Merriweather"],
                        "display-lg": ["Playfair Display"],
                        "caption": ["Public Sans"],
                        "ui-label": ["Public Sans"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "article-body": ["20px", { "lineHeight": "34px", "fontWeight": "400" }],
                        "ui-button": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-md": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "article-body-mobile": ["18px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "ui-label": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed Header/Nav as this is a transactional screen -->
<main class="flex-grow flex items-center justify-center p-margin-edge">
<div class="max-w-[480px] w-full bg-surface-container-lowest border border-outline-variant p-stack-lg relative overflow-hidden group hover:shadow-lg transition-shadow duration-300">
<!-- Subtle decorative element honoring the print aesthetic -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left"></div>
<div class="text-center mb-stack-md">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary mb-stack-sm">Folio</h1>
<p class="font-article-body-mobile text-article-body-mobile md:font-article-body md:text-article-body text-on-surface-variant">The Modern Atelier</p>
</div>
<form class="space-y-stack-md">
<!-- Avatar Upload -->
<div class="flex flex-col items-center justify-center gap-stack-sm">
<div class="w-24 h-24 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center overflow-hidden relative group/avatar cursor-pointer">
<img class="object-cover w-full h-full opacity-50 group-hover/avatar:opacity-30 transition-opacity" data-alt="A minimalist, high-key portrait silhouette representing an anonymous writer in a modern literary space, soft white and deep ink purple tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgy8WEImlNeK22XVuC8x_TXy4NbcNoDe3dRsVtpYXrPeE1Zbs6mu8Hr6xk6t4CA7BUmIBEBtyoHN62VYaFhlKI5XBUeHn_hbYX1hiJH8XmYyWIv15QrLs1dYsGN1-rzwbKy7hsfrCDeltZgeKw2B9a9kPf5_rcBCAjjWa4DSMlL_3GoJDsY4bsq-LfCFJzi6tVeYJmaUUyB_NzWRi-JyDO5xnxHnysCzVD2ygQnOdD8za8WqoewR5u3A"/>
<span class="material-symbols-outlined absolute text-on-surface opacity-0 group-hover/avatar:opacity-100 transition-opacity" style="font-size: 32px;">upload</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Upload Avatar (Optional)</span>
</div>
<!-- Username -->
<div>
<label class="block font-ui-label text-ui-label text-on-surface mb-2" for="username">Username</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-article-body-mobile text-article-body-mobile placeholder-on-surface-variant/50 transition-colors" id="username" name="username" placeholder="e.g. j.doe" type="text"/>
</div>
<!-- Password -->
<div>
<label class="block font-ui-label text-ui-label text-on-surface mb-2" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-article-body-mobile text-article-body-mobile placeholder-on-surface-variant/50 transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="mt-2 flex items-center gap-2">
<div class="h-1 flex-grow bg-surface-container-high rounded overflow-hidden">
<div class="h-full bg-primary w-1/3 transition-all duration-300"></div> <!-- Mock strength -->
</div>
<span class="font-caption text-caption text-on-surface-variant w-12 text-right">Weak</span>
</div>
</div>
<!-- Bio -->
<div>
<label class="block font-ui-label text-ui-label text-on-surface mb-2" for="bio">Short Bio <span class="font-caption text-caption text-outline">(Optional)</span></label>
<textarea class="w-full bg-transparent border border-outline-variant focus:border-primary focus:ring-0 p-3 font-article-body-mobile text-article-body-mobile placeholder-on-surface-variant/50 resize-none transition-colors rounded-none" id="bio" name="bio" placeholder="A few words about your craft..." rows="3"></textarea>
</div>
<div class="pt-stack-sm">
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-ui-button text-ui-button py-3 px-6 transition-colors duration-200" type="button">
                        Create Account
                    </button>
</div>
<div class="text-center mt-stack-md pt-stack-md border-t border-outline-variant">
<a class="font-ui-label text-ui-label text-on-surface-variant hover:text-primary transition-colors" href="#">
                        Already have an account? Log in
                    </a>
</div>
</form>
</div>
</main>
</body></html>
