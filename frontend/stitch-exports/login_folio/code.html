<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);

<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center p-margin-edge relative overflow-hidden">
<!-- Decorative atmospheric background element -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none" style="background-image: radial-gradient(circle at 80% 20%, #eaddff 0%, transparent 40%), radial-gradient(circle at 20% 80%, #dee9fc 0%, transparent 40%);"></div>
<div class="relative z-10 w-full max-w-md mx-auto">
<!-- Brand Anchor -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Folio</h1>
<p class="font-article-body text-article-body text-on-surface-variant mt-stack-sm opacity-80">The Modern Atelier</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant p-stack-lg rounded-xl shadow-sm transition-shadow duration-300 hover:shadow-[0_8px_30px_rgb(53,37,205,0.08)]">
<h2 class="font-headline-md text-headline-md mb-stack-lg text-center">Sign In</h2>
<form class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-2">
<label class="font-ui-label text-ui-label text-on-surface-variant" for="username">Username or Email</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-article-body-mobile text-article-body-mobile text-on-surface transition-colors rounded-none placeholder:text-outline" id="username" name="username" placeholder="Enter your credentials" type="text"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-ui-label text-ui-label text-on-surface-variant" for="password">Password</label>
<a class="font-caption text-caption text-primary hover:text-secondary transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-article-body-mobile text-article-body-mobile text-on-surface transition-colors rounded-none placeholder:text-outline" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="mt-stack-md">
<button class="w-full bg-primary text-on-primary font-ui-button text-ui-button py-3 px-6 rounded-DEFAULT hover:bg-secondary transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2 group" type="submit">
                        Log In
                        <span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Secondary Action -->
<div class="text-center mt-stack-md">
<p class="font-ui-label text-ui-label text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary hover:text-secondary font-bold transition-colors border-b border-transparent hover:border-secondary" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Suppressed Nav/Footer per instruction: Linear/Transactional screen -> HIDE SHELL -->
</body></html>
